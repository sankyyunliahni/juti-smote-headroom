<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1129" viewBox="0 0 1650 1129" font-family="Arial, Helvetica, sans-serif"><rect width="1650" height="1129" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 9 4.5 L 0 9 Z" fill="#808080"/></marker></defs><g fill="none" stroke="#808080" stroke-width="2.5"><path d="M 330 204 H 360 V 472 H 381" marker-end="url(#arrow)"/><path d="M 330 910 H 360 V 657 H 381" marker-end="url(#arrow)"/><path d="M 720 564 H 762"/><path d="M 762 93 V 1022"/><path d="M 762 93 H 781" marker-end="url(#arrow)"/><path d="M 1290 93 H 1341" marker-end="url(#arrow)"/><path d="M 762 307 H 781" marker-end="url(#arrow)"/><path d="M 1290 307 H 1341" marker-end="url(#arrow)"/><path d="M 762 564 H 781" marker-end="url(#arrow)"/><path d="M 1290 564 H 1341" marker-end="url(#arrow)"/><path d="M 762 808 H 781" marker-end="url(#arrow)"/><path d="M 1290 808 H 1341" marker-end="url(#arrow)"/><path d="M 762 1022 H 781" marker-end="url(#arrow)"/><path d="M 1290 1022 H 1341" marker-end="url(#arrow)"/></g><rect x="30" y="124.5" width="300" height="159" rx="9" fill="#1F4E79"/><text x="180.0" y="162.5" font-size="28px" fill="#FFFFFF" font-weight="bold" text-anchor="middle">CIC-IDS2017</text><text x="180.0" y="200.5" font-size="24px" fill="#FFFFFF" text-anchor="middle">de-duplicated</text><text x="180.0" y="229.5" font-size="24px" fill="#FFFFFF" text-anchor="middle">124,127 records</text><text x="180.0" y="258.5" font-size="24px" fill="#FFFFFF" text-anchor="middle">65 features</text><rect x="30" y="845.5" width="300" height="130" rx="9" fill="#1F4E79"/><text x="180.0" y="883.5" font-size="28px" fill="#FFFFFF" font-weight="bold" text-anchor="middle">CSE-CIC-IDS2018</text><text x="180.0" y="921.5" font-size="24px" fill="#FFFFFF" text-anchor="middle">de-duplicated</text><text x="180.0" y="950.5" font-size="24px" fill="#FFFFFF" text-anchor="middle">Infiltration capture days</text><rect x="390" y="353.5" width="330" height="422" rx="9" fill="#1F4E79"/><text x="555.0" y="391.5" font-size="28px" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Identical</text><text x="555.0" y="423.5" font-size="28px" fill="#FFFFFF" font-weight="bold" text-anchor="middle">preprocessing</text><text x="408" y="465.5" font-size="24px" fill="#FFFFFF">• drop non-numeric and</text><text x="424" y="494.5" font-size="24px" fill="#FFFFFF">constant columns</text><text x="408" y="529.5" font-size="24px" fill="#FFFFFF">• drop infinite and missing</text><text x="424" y="558.5" font-size="24px" fill="#FFFFFF">values</text><text x="408" y="593.5" font-size="24px" fill="#FFFFFF">• scaling fitted on the</text><text x="424" y="622.5" font-size="24px" fill="#FFFFFF">training folds only</text><text x="408" y="657.5" font-size="24px" fill="#FFFFFF">• map labels to seven</text><text x="424" y="686.5" font-size="24px" fill="#FFFFFF">categories</text><text x="408" y="721.5" font-size="24px" fill="#FFFFFF">• cap each category at</text><text x="424" y="750.5" font-size="24px" fill="#FFFFFF">30,000 records</text><rect x="790" y="30" width="500" height="126" rx="9" fill="#FFFFFF" stroke="#9DC3E6" stroke-width="2.5"/><text x="808" y="68" font-size="28px" fill="#1F4E79" font-weight="bold">A · Base-model selection</text><text x="808" y="102" font-size="24px" fill="#333333">Eight algorithms under an 80:20 split with</text><text x="808" y="131" font-size="24px" fill="#333333">the same 65 features (Table 2)</text><rect x="790" y="186" width="500" height="242" rx="9" fill="#FFFFFF" stroke="#9DC3E6" stroke-width="2.5"/><text x="808" y="224" font-size="28px" fill="#1F4E79" font-weight="bold">B · Controlled experiment at n = 29</text><text x="808" y="258" font-size="24px" fill="#333333">Six categories trimmed one at a time to the</text><text x="808" y="287" font-size="24px" fill="#333333">same 29 training samples and the same</text><text x="808" y="316" font-size="24px" fill="#333333">balancing target, so only category varies.</text><text x="808" y="345" font-size="24px" fill="#333333">No handling, random oversampling and</text><text x="808" y="374" font-size="24px" fill="#333333">SMOTE, under Random Forest, XGBoost</text><text x="808" y="403" font-size="24px" fill="#333333">and a two-layer perceptron (Tables 3–5)</text><rect x="790" y="458" width="500" height="213" rx="9" fill="#FFFFFF" stroke="#9DC3E6" stroke-width="2.5"/><text x="808" y="496" font-size="28px" fill="#1F4E79" font-weight="bold">C · Why the gains differ</text><text x="808" y="530" font-size="24px" fill="#333333">Geometry of the training subsets; where</text><text x="808" y="559" font-size="24px" fill="#333333">synthetic points intrude and where missed</text><text x="808" y="588" font-size="24px" fill="#333333">attacks are sent instead; feature overlap</text><text x="808" y="617" font-size="24px" fill="#333333">and restricted representation (Tables 6–9,</text><text x="808" y="646" font-size="24px" fill="#333333">13–14)</text><rect x="790" y="701" width="500" height="213" rx="9" fill="#FFFFFF" stroke="#9DC3E6" stroke-width="2.5"/><text x="808" y="739" font-size="28px" fill="#1F4E79" font-weight="bold">D · Robustness and attribution</text><text x="808" y="773" font-size="24px" fill="#333333">Nested ablation at 29, 50, 100 and 500</text><text x="808" y="802" font-size="24px" fill="#333333">training samples; sensitivity to the SMOTE</text><text x="808" y="831" font-size="24px" fill="#333333">neighbourhood size and oversampling</text><text x="808" y="860" font-size="24px" fill="#333333">ratio; classifier capacity varied with the</text><text x="808" y="889" font-size="24px" fill="#333333">subset held fixed (Tables 10–12)</text><rect x="790" y="944" width="500" height="155" rx="9" fill="#FFFFFF" stroke="#9DC3E6" stroke-width="2.5"/><text x="808" y="982" font-size="28px" fill="#1F4E79" font-weight="bold">E · Limits on a scarce category</text><text x="808" y="1016" font-size="24px" fill="#333333">Twelve configurations on the 36-record</text><text x="808" y="1045" font-size="24px" fill="#333333">Infiltration category; CSE-CIC-IDS2018</text><text x="808" y="1074" font-size="24px" fill="#333333">learning curve at 1:1 (Tables 15–17)</text><rect x="1350" y="30" width="270" height="1069" rx="9" fill="#1F4E79"/><text x="1485.0" y="68" font-size="28px" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Evaluation</text><text x="1368" y="116" font-size="24px" fill="#FFFFFF">• precision, recall and</text><text x="1384" y="145" font-size="24px" fill="#FFFFFF">F1 per category</text><text x="1368" y="304.68181818181813" font-size="24px" fill="#FFFFFF">• stratified five-fold</text><text x="1384" y="333.68181818181813" font-size="24px" fill="#FFFFFF">cross-validation,</text><text x="1384" y="362.68181818181813" font-size="24px" fill="#FFFFFF">three seeds</text><text x="1368" y="522.3636363636363" font-size="24px" fill="#FFFFFF">• resolution limit r,</text><text x="1384" y="551.3636363636363" font-size="24px" fill="#FFFFFF">95% Wilson</text><text x="1384" y="580.3636363636363" font-size="24px" fill="#FFFFFF">intervals</text><text x="1368" y="740.0454545454544" font-size="24px" fill="#FFFFFF">• Wilcoxon</text><text x="1384" y="769.0454545454544" font-size="24px" fill="#FFFFFF">signed-rank tests on</text><text x="1384" y="798.0454545454544" font-size="24px" fill="#FFFFFF">folds</text><text x="1368" y="957.7272727272725" font-size="24px" fill="#FFFFFF">• Spearman</text><text x="1384" y="986.7272727272725" font-size="24px" fill="#FFFFFF">correlation across</text><text x="1384" y="1015.7272727272725" font-size="24px" fill="#FFFFFF">categories</text></svg>